[env:sensebox_eye]
platform = https://github.com/sensebox/platform-espressif32/archive/refs/tags/1.0.0.zip
board = sensebox_eye
framework = arduino
lib_deps = 
	adafruit/Adafruit SSD1306 @ ^2.5.10
	adafruit/Adafruit HDC1000 Library@^2.0.2
	https://github.com/felixerdy/QRCodeGenerator.git
	adafruit/Adafruit MAX1704X@^1.0.3
	adafruit/Adafruit NeoPixel@^1.12.2
	invensenseinc/ICM42670P@^1.0.7
	adafruit/Adafruit ICM20X@^2.0.7
